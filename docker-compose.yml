version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: mern_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: project_database
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - mern_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Node.js Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mern_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/project_database
      ML_SERVICE_URL: http://ml-service:8000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mern_network
    restart: unless-stopped
    command: npm start

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mern_frontend
    ports:
      - "80:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - mern_network
    restart: unless-stopped

  # Python ML Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: mern_ml_service
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DEBUG: 'False'
    networks:
      - mern_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  mern_network:
    driver: bridge
